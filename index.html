@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&family=PT+Mono&display=swap');

html, body { margin:0; padding:0; background:#12140f; }
.rm-root { font-family:'Manrope',sans-serif; background-color:#12140f; background-image:radial-gradient(rgba(110,222,90,0.09) 1px, transparent 1px); background-size:24px 24px; color:#f2ead9; min-height:100vh; padding:32px 20px 64px; box-sizing:border-box; }
.rm-loading-text { min-height:60vh; display:flex; align-items:center; justify-content:center; font-family:'PT Mono',monospace; color:#6ede5a; letter-spacing:0.05em; font-size:14px; text-align:center; }
.rm-header { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; max-width:1100px; margin:0 auto; }
.rm-title { font-family:'Unbounded',sans-serif; font-weight:800; font-size:26px; margin:0; color:#f2ead9; }
.rm-title span { color:#6ede5a; }
.rm-status { font-family:'PT Mono',monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:#a79c85; display:flex; align-items:center; gap:7px; padding-top:8px; }
.rm-status-dot { width:7px; height:7px; border-radius:50%; background:#4a5240; transition:background 0.3s; flex-shrink:0; }
.rm-status-dot.saving { background:#d9a441; animation:rm-pulse 0.9s infinite ease-in-out; }
.rm-status-dot.saved { background:#6ede5a; }
@keyframes rm-pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
.rm-tabs { max-width:1100px; margin:22px auto 24px; display:flex; border-bottom:1px solid rgba(242,234,217,0.12); }
.rm-tab { font-family:'PT Mono',monospace; font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase; background:none; border:none; color:#a79c85; padding:10px 4px; cursor:pointer; position:relative; transition:color 0.2s; }
.rm-tab + .rm-tab { margin-left:24px; }
.rm-tab:hover { color:#f2ead9; }
.rm-tab.active { color:#6ede5a; }
.rm-tab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:#6ede5a; box-shadow:0 0 8px rgba(110,222,90,0.7); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid #6ede5a; outline-offset:2px; }

.rm-caption { max-width:1100px; margin:0 auto 14px; font-family:'PT Mono',monospace; font-size:11px; letter-spacing:0.04em; text-transform:uppercase; color:#7c8f74; }

.rm-ribbon-outer { max-width:1100px; margin:0 auto 22px; overflow-x:auto; border:1px solid rgba(242,234,217,0.12); border-radius:6px; background:rgba(242,234,217,0.015); }
.rm-ribbon-outer svg { display:block; }
.rm-ribbon-point { cursor:grab; touch-action:none; }
.rm-ribbon-point:active { cursor:grabbing; }
.rm-ribbon-star { cursor:pointer; touch-action:none; user-select:none; }
.rm-ribbon-empty { max-width:1100px; margin:0 auto 22px; text-align:center; color:#7c8f74; font-family:'PT Mono',monospace; font-size:12.5px; padding:24px 20px; border:1px dashed rgba(242,234,217,0.15); border-radius:8px; }

.rm-toolbar { max-width:1100px; margin:0 auto 16px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.rm-search-wrap { position:relative; flex:1; min-width:220px; max-width:380px; }
.rm-search-input { width:100%; box-sizing:border-box; font-family:'Manrope',sans-serif; font-size:12.5px; background:rgba(242,234,217,0.04); border:1px solid rgba(242,234,217,0.18); color:#f2ead9; border-radius:6px; padding:8px 12px; }
.rm-search-input:focus { outline:none; border-color:#6ede5a; }
.rm-search-results { position:absolute; top:100%; left:0; right:0; margin-top:6px; max-height:320px; overflow-y:auto; background:#1c2119; border:1px solid rgba(110,222,90,0.35); border-radius:7px; padding:6px; box-shadow:0 12px 28px rgba(0,0,0,0.5); z-index:40; }
.rm-search-result { display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; background:none; border:none; border-radius:5px; padding:7px 9px; cursor:pointer; }
.rm-search-result:hover { background:rgba(110,222,90,0.12); }
.rm-search-result-num { font-family:'PT Mono',monospace; font-size:9.5px; letter-spacing:.04em; color:#6ede5a; }
.rm-search-result-field { font-family:'PT Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.04em; color:#7c8f74; }
.rm-search-result-text { font-family:'Manrope',sans-serif; font-size:12px; color:#f2ead9; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rm-search-empty { font-family:'PT Mono',monospace; font-size:11px; color:#7c8f74; padding:8px 9px; }
.rm-runtime-stat { font-family:'PT Mono',monospace; font-size:11px; letter-spacing:.03em; color:#7c8f74; white-space:nowrap; }
.rm-toolbar-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }

.rm-editor-nav { display:flex; justify-content:space-between; gap:10px; margin-bottom:14px; }
.rm-editor-nav-btn { background:none; border:1px solid rgba(242,234,217,0.18); color:#a79c85; font-family:'PT Mono',monospace; font-size:10.5px; letter-spacing:.03em; border-radius:5px; padding:6px 11px; cursor:pointer; }
.rm-editor-nav-btn:hover:not(:disabled) { border-color:#6ede5a; color:#6ede5a; }
.rm-editor-nav-btn:disabled { opacity:0.3; cursor:default; }

.rm-scene-subplot { font-family:'Manrope',sans-serif; font-size:11.5px; color:#d9a441; width:100%; background:transparent; border:none; border-bottom:1px dashed rgba(217,164,65,0.3); margin-top:8px; padding:0 0 6px; box-sizing:border-box; }
.rm-scene-note { width:100%; box-sizing:border-box; font-family:'Manrope',sans-serif; font-style:italic; font-size:12px; color:#7c8f74; background:rgba(242,234,217,0.03); border:1px dashed rgba(242,234,217,0.15); border-radius:6px; padding:9px 11px; margin:14px 0; resize:vertical; }

.rm-subplot-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-left:6px; vertical-align:middle; }

.rm-char-stats { max-width:1100px; margin:0 auto 20px; }
.rm-char-stat-row { display:grid; grid-template-columns:140px 1fr auto; align-items:center; gap:10px; padding:4px 0; }
.rm-char-stat-name { font-family:'PT Mono',monospace; font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rm-char-stat-bar-wrap { height:6px; background:rgba(242,234,217,0.06); border-radius:3px; overflow:hidden; }
.rm-char-stat-bar { display:block; height:100%; border-radius:3px; }
.rm-char-stat-num { font-family:'PT Mono',monospace; font-size:10.5px; color:#7c8f74; white-space:nowrap; }

.rm-timeline-outer { max-width:1100px; margin:0 auto 26px; overflow-x:auto; border:1px solid rgba(242,234,217,0.12); border-radius:6px; background:rgba(242,234,217,0.015); }
.rm-timeline-scroll { display:flex; min-width:max-content; }
.rm-timeline-col { flex:0 0 172px; border-right:1px solid rgba(242,234,217,0.1); display:flex; flex-direction:column; }
.rm-timeline-col:last-child { border-right:none; }
.rm-timeline-col-head { font-family:'PT Mono',monospace; font-size:10.5px; letter-spacing:0.03em; text-transform:uppercase; color:#8fae82; padding:10px 11px 9px; border-bottom:1px solid rgba(242,234,217,0.1); background:rgba(110,222,90,0.045); line-height:1.35; }
.rm-timeline-col-body { padding:9px; display:flex; flex-direction:column; gap:7px; flex:1; min-height:120px; transition:background .15s, outline .15s; }
.rm-timeline-col-body.drag-over { background:rgba(110,222,90,0.09); outline:1.5px dashed rgba(110,222,90,0.55); outline-offset:-4px; border-radius:3px; }
.rm-scene-chip { text-align:left; background:#1c2119; border:1px solid rgba(242,234,217,0.14); border-radius:4px; padding:8px 9px; cursor:grab; color:#f2ead9; font-family:'Manrope',sans-serif; transition:border-color .15s,background .15s,opacity .15s; width:100%; }
.rm-scene-chip:active { cursor:grabbing; }
.rm-scene-chip:hover { border-color:rgba(110,222,90,0.5); }
.rm-scene-chip.active { border-color:#6ede5a; background:rgba(110,222,90,0.1); box-shadow:0 0 0 1px rgba(110,222,90,0.3); }
.rm-scene-chip.dragging { opacity:0.35; }
.rm-scene-chip-num { display:block; font-family:'PT Mono',monospace; font-size:9.5px; color:#7c8f74; letter-spacing:.04em; }
.rm-scene-chip-title { display:block; margin-top:3px; font-size:12px; line-height:1.35; overflow-wrap:break-word; }
.rm-scene-chip-tags { display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
.rm-scene-chip-tag { font-family:'PT Mono',monospace; font-size:8.5px; letter-spacing:.02em; padding:1px 5px; border-radius:8px; border:1px solid; color:#c9c0ab; white-space:nowrap; }
.rm-scene-add { border:1.5px dashed rgba(242,234,217,0.25); background:none; color:#7c8f74; border-radius:4px; padding:9px; font-size:11px; font-family:'PT Mono',monospace; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; }
.rm-scene-add:hover { border-color:#6ede5a; color:#6ede5a; }

.rm-editor-empty { max-width:760px; margin:0 auto; text-align:center; color:#7c8f74; font-family:'PT Mono',monospace; font-size:13px; padding:60px 20px; border:1px dashed rgba(242,234,217,0.15); border-radius:8px; }
.rm-editor { background:#171b13; border:1px solid rgba(242,234,217,0.1); border-radius:8px; padding:28px 34px 22px; max-width:760px; margin:0 auto; }
.rm-editor-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:6px; flex-wrap:wrap; }
.rm-editor-top-fields { flex:1; min-width:220px; }
.rm-scene-heading { font-family:'PT Mono',monospace; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:14.5px; width:100%; background:transparent; border:none; border-bottom:1px dashed rgba(242,234,217,0.25); color:#f2ead9; padding:0 0 8px; box-sizing:border-box; }
.rm-scene-title-short { font-family:'Manrope',sans-serif; font-size:12px; color:#7c8f74; width:100%; background:transparent; border:none; margin-top:8px; padding:0; box-sizing:border-box; }
.rm-editor-side { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.rm-stage-select { font-family:'PT Mono',monospace; font-size:10.5px; text-transform:uppercase; background:rgba(242,234,217,0.05); border:1px solid rgba(242,234,217,0.18); color:#a79c85; border-radius:4px; padding:5px 7px; }
.rm-editor-delete { flex-shrink:0; background:none; border:none; color:#a8432a; font-family:'PT Mono',monospace; font-size:10.5px; cursor:pointer; display:flex; gap:4px; align-items:center; padding:0; }
.rm-editor-delete:hover { text-decoration:underline; }
.rm-blocks { display:flex; flex-direction:column; gap:2px; margin:18px 0; }
.rm-block { position:relative; }
.rm-block-del { position:absolute; right:-4px; top:2px; background:#12140f; border:1px solid rgba(242,234,217,0.15); border-radius:3px; width:16px; height:16px; line-height:1; color:#7c8f74; cursor:pointer; opacity:0; transition:opacity .15s; font-size:11px; }
.rm-block:hover .rm-block-del, .rm-block:focus-within .rm-block-del { opacity:1; }
.rm-block-del:hover { color:#a8432a; border-color:#a8432a; }
.rm-b-action, .rm-b-character, .rm-b-dialogue, .rm-b-transition { display:block; width:100%; background:transparent; border:none; font-family:'PT Mono',monospace; resize:none; box-sizing:border-box; }
.rm-b-action { color:#e4dcc9; font-size:13px; line-height:1.65; padding:6px 22px 6px 2px; }
.rm-b-character { color:#6ede5a; font-weight:700; font-size:13px; text-align:center; text-transform:uppercase; letter-spacing:.04em; padding:14px 22px 2px 2px; }
.rm-b-dialogue { width:68%; margin:0 auto; color:#e4dcc9; font-size:13px; line-height:1.6; padding:2px 22px 2px 2px; }
.rm-b-transition { color:#a79c85; font-size:12px; text-align:right; text-transform:uppercase; letter-spacing:.05em; padding:10px 22px 2px 2px; }
.rm-b-paren-wrap { display:flex; align-items:center; justify-content:center; gap:1px; padding:4px 22px 2px 2px; }
.rm-b-paren-wrap span { font-family:'PT Mono',monospace; color:#8a9a80; font-size:12px; }
.rm-b-parenthetical { width:200px; max-width:70%; background:transparent; border:none; border-bottom:1px dotted rgba(242,234,217,0.25); color:#8a9a80; font-family:'PT Mono',monospace; font-style:italic; font-size:12px; text-align:center; padding:2px 4px; box-sizing:border-box; }
.rm-block-toolbar { display:flex; flex-wrap:wrap; gap:8px; padding-top:16px; border-top:1px dashed rgba(242,234,217,0.15); }
.rm-block-toolbar button { font-family:'PT Mono',monospace; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase; background:rgba(242,234,217,0.05); border:1px solid rgba(242,234,217,0.15); color:#a79c85; border-radius:4px; padding:7px 10px; cursor:pointer; }
.rm-block-toolbar button:hover { border-color:#6ede5a; color:#6ede5a; }
.rm-block-toolbar button.active { border-color:#6ede5a; color:#6ede5a; background:rgba(110,222,90,0.14); }
.rm-hint-row { font-family:'PT Mono',monospace; font-size:10px; color:#5c6b53; margin-top:10px; letter-spacing:.02em; }

.rm-char-picker-wrap { position:relative; display:inline-block; }
.rm-char-picker { position:absolute; bottom:100%; left:0; margin-bottom:6px; width:220px; max-height:260px; overflow-y:auto; background:#1c2119; border:1px solid rgba(110,222,90,0.35); border-radius:7px; padding:6px; box-shadow:0 12px 28px rgba(0,0,0,0.5); z-index:40; }
.rm-char-picker-item { display:block; width:100%; text-align:left; background:none; border:none; color:#e4dcc9; font-family:'Manrope',sans-serif; font-size:12.5px; padding:7px 8px; border-radius:4px; cursor:pointer; }
.rm-char-picker-item:hover { background:rgba(110,222,90,0.14); color:#6ede5a; }
.rm-char-picker-divider { height:1px; background:rgba(242,234,217,0.12); margin:5px 2px; }
.rm-char-picker-empty { color:#7c8f74; font-size:11.5px; font-family:'Manrope',sans-serif; padding:6px 8px 8px; text-align:center; }
.rm-char-picker-new { display:flex; gap:5px; padding:4px 2px 2px; }
.rm-char-picker-new input { flex:1; min-width:0; background:rgba(242,234,217,0.05); border:1px solid rgba(242,234,217,0.18); border-radius:4px; color:#f2ead9; font-family:'Manrope',sans-serif; font-size:12px; padding:6px 7px; box-sizing:border-box; }
.rm-char-picker-new button { flex-shrink:0; background:rgba(110,222,90,0.18); border:1px solid rgba(110,222,90,0.4); color:#6ede5a; border-radius:4px; font-family:'PT Mono',monospace; font-size:10.5px; text-transform:uppercase; padding:0 9px; cursor:pointer; }

.rm-char-wrap { position:relative; }
.rm-char-tooltip { position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:8px; width:230px; z-index:30; background:#1c2119; border:1px solid rgba(110,222,90,0.4); border-radius:7px; padding:11px 13px; text-align:left; box-shadow:0 10px 26px rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity .12s; }
.rm-char-tooltip::before { content:''; position:absolute; top:-5px; left:50%; transform:translateX(-50%) rotate(45deg); width:9px; height:9px; background:#1c2119; border-left:1px solid rgba(110,222,90,0.4); border-top:1px solid rgba(110,222,90,0.4); }
.rm-char-wrap:hover .rm-char-tooltip, .rm-fs-character:hover .rm-char-tooltip { opacity:1; }
.rm-char-tooltip-name { font-family:'Unbounded',sans-serif; font-weight:600; font-size:12.5px; color:#6ede5a; text-transform:none; letter-spacing:0; margin-bottom:7px; }
.rm-char-tooltip .rm-field-label { color:#7c8f74; }
.rm-char-tooltip .rm-field-value { color:#e4dcc9; margin-bottom:6px; }

.rm-fs-header { max-width:760px; margin:0 auto 14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.rm-fs-stats { font-family:'PT Mono',monospace; font-size:11px; color:#7c8f74; letter-spacing:.03em; }
.rm-download-btn { display:flex; align-items:center; gap:6px; font-family:'PT Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.03em; background:rgba(110,222,90,0.15); border:1px solid rgba(110,222,90,0.4); color:#6ede5a; border-radius:5px; padding:8px 12px; cursor:pointer; }
.rm-download-btn:hover { background:rgba(110,222,90,0.25); }
.rm-project-io { display:flex; gap:8px; flex-wrap:wrap; }
.rm-project-io .rm-download-btn.import { background:rgba(217,164,65,0.12); border-color:rgba(217,164,65,0.4); color:#d9a441; }
.rm-project-io .rm-download-btn.import:hover { background:rgba(217,164,65,0.22); }
.rm-fullscript-wrap { max-width:760px; margin:0 auto; background:#171b13; border:1px solid rgba(242,234,217,0.1); border-radius:8px; padding:38px 42px; }
.rm-fs-empty { text-align:center; color:#7c8f74; font-family:'PT Mono',monospace; padding:40px 0; }
.rm-fs-scene { margin-bottom:32px; padding-bottom:24px; border-bottom:1px dashed rgba(242,234,217,0.12); }
.rm-fs-scene:last-child { border:none; margin-bottom:0; padding-bottom:0; }
.rm-fs-num { font-family:'PT Mono',monospace; font-size:10px; color:#6ede5a; letter-spacing:.06em; margin-bottom:4px; }
.rm-fs-heading { font-family:'PT Mono',monospace; font-weight:700; text-transform:uppercase; font-size:14px; color:#f2ead9; margin-bottom:14px; letter-spacing:.02em; }
.rm-fs-action { font-family:'PT Mono',monospace; font-size:13px; color:#e4dcc9; line-height:1.7; margin-bottom:4px; white-space:pre-wrap; }
.rm-fs-character { position:relative; font-family:'PT Mono',monospace; font-weight:700; font-size:13px; color:#6ede5a; text-align:center; text-transform:uppercase; letter-spacing:.04em; margin-top:14px; }
.rm-fs-parenthetical { font-family:'PT Mono',monospace; font-style:italic; font-size:12px; color:#8a9a80; text-align:center; margin-top:2px; }
.rm-fs-dialogue { font-family:'PT Mono',monospace; font-size:13px; color:#e4dcc9; line-height:1.6; width:68%; margin:2px auto 4px; white-space:pre-wrap; }
.rm-fs-transition { font-family:'PT Mono',monospace; font-size:12px; color:#a79c85; text-align:right; text-transform:uppercase; letter-spacing:.05em; margin-top:10px; }

.rm-board-grid { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
.rm-card { background:#171b13; border:1px solid rgba(242,234,217,0.1); border-left-width:4px; border-left-style:solid; border-radius:5px; padding:16px 16px 14px; position:relative; cursor:pointer; transition:transform .15s, border-color .15s; }
.rm-card:hover { transform:translateY(-2px); border-color:rgba(242,234,217,0.22); }
.rm-edit-hint { position:absolute; top:12px; right:12px; color:#7c8f74; opacity:0; transition:opacity .2s; }
.rm-card:hover .rm-edit-hint { opacity:.8; }
.rm-card-name { font-family:'Unbounded',sans-serif; font-size:15px; font-weight:600; margin:0 0 12px; color:#f2ead9; }
.rm-name-input { font-family:'Unbounded',sans-serif; font-size:15px; font-weight:600; width:100%; border:none; border-bottom:1px dashed rgba(242,234,217,0.3); background:transparent; margin:0 0 12px; padding:0 0 8px; color:#f2ead9; box-sizing:border-box; }
.rm-card-fields { display:flex; flex-direction:column; gap:9px; }
.rm-field-label { display:block; font-family:'PT Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:#7c8f74; margin-bottom:2px; }
.rm-field-value { display:block; font-size:12.5px; line-height:1.45; color:#c9c0ab; }
.rm-field-input { width:100%; font-family:'Manrope',sans-serif; font-size:12.5px; line-height:1.4; border:1px solid rgba(242,234,217,0.18); border-radius:3px; padding:5px 6px; background:rgba(242,234,217,0.04); resize:vertical; color:#f2ead9; box-sizing:border-box; }
.rm-card-actions { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:10px; border-top:1px dashed rgba(242,234,217,0.15); }
.rm-btn-ghost, .rm-btn-primary { font-family:'PT Mono',monospace; font-size:11px; letter-spacing:0.03em; text-transform:uppercase; border:none; border-radius:3px; padding:7px 10px; cursor:pointer; display:flex; align-items:center; gap:5px; }
.rm-btn-ghost { background:none; color:#c1502e; padding-left:0; }
.rm-btn-ghost:hover { text-decoration:underline; }
.rm-btn-primary { background:rgba(110,222,90,0.15); color:#6ede5a; border:1px solid rgba(110,222,90,0.4); }
.rm-btn-primary:hover { background:rgba(110,222,90,0.25); }
.rm-add-card { border:1.5px dashed rgba(242,234,217,0.3); border-radius:5px; background:none; color:#a79c85; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:180px; cursor:pointer; font-family:'Manrope',sans-serif; font-size:13px; transition:border-color .2s,color .2s; }
.rm-add-card:hover { border-color:#6ede5a; color:#6ede5a; }
.rm-reset-link { max-width:1100px; margin:24px auto 0; display:flex; align-items:center; gap:6px; background:none; border:none; color:#6b6252; font-family:'PT Mono',monospace; font-size:11px; cursor:pointer; letter-spacing:0.03em; padding:0; }
.rm-reset-link:hover { color:#a79c85; }

.rm-header-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.rm-history-controls { display:flex; gap:6px; }
.rm-history-btn { display:flex; align-items:center; justify-content:center; width:26px; height:26px; background:rgba(242,234,217,0.04); border:1px solid rgba(242,234,217,0.16); border-radius:5px; color:#a79c85; cursor:pointer; transition:border-color 0.15s, color 0.15s, opacity 0.15s; padding:0; }
.rm-history-btn:hover:not(:disabled) { border-color:#6ede5a; color:#6ede5a; }
.rm-history-btn:disabled { opacity:0.28; cursor:default; }

.rm-timeline-col-stats { display:block; margin-top:3px; font-size:9.5px; text-transform:none; letter-spacing:0.02em; color:#7c8f74; }

.rm-graph-outer { max-width:1100px; margin:0 auto 20px; overflow-x:auto; display:flex; flex-direction:column; align-items:center; gap:8px; }
.rm-graph-outer svg { display:block; flex-shrink:0; }

.rm-subplot-outer { max-width:1100px; margin:0 auto 26px; overflow-x:auto; border:1px solid rgba(242,234,217,0.12); border-radius:6px; background:rgba(242,234,217,0.015); }
.rm-subplot-scroll { min-width:max-content; }
.rm-subplot-grid { display:grid; }
.rm-subplot-corner { border-bottom:1px solid rgba(242,234,217,0.1); }
.rm-subplot-head-cell { font-family:'PT Mono',monospace; font-size:10.5px; text-align:center; color:#8fae82; padding:9px 4px; border-bottom:1px solid rgba(242,234,217,0.1); border-left:1px solid rgba(242,234,217,0.07); background:rgba(110,222,90,0.045); }
.rm-subplot-row-label { font-family:'Manrope',sans-serif; font-size:12px; font-weight:600; padding:9px 11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-top:1px solid rgba(242,234,217,0.07); }
.rm-subplot-cell-wrap { display:flex; align-items:center; justify-content:center; padding:7px 4px; border-top:1px solid rgba(242,234,217,0.07); border-left:1px solid rgba(242,234,217,0.07); }
.rm-subplot-cell { display:block; width:16px; height:16px; border-radius:4px; background:rgba(242,234,217,0.06); border:1px solid rgba(242,234,217,0.12); }
.rm-subplot-cell.filled { border-color:transparent; box-shadow:0 0 0 1px rgba(0,0,0,0.2) inset; }

@media (max-width:680px){ .rm-title{ font-size:21px; } .rm-editor{ padding:22px 18px 20px; } .rm-fullscript-wrap{ padding:26px 20px; } .rm-fs-header{ flex-direction:column; align-items:flex-start; } }
